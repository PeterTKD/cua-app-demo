<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUA-5.4 History</title>
    <style>
        :root {
            --ink-1: #0f172a;
            --ink-2: #475569;
            --border: #d7e2f1;
            --panel: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow-y: auto;
        }

        body {
            margin: 0;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background: #f5f7fb;
            color: var(--ink-1);
        }

        .sticky-model-bar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #f5f7fb;
            border-bottom: 1px solid var(--border);
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sticky-model-bar label {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-2);
            white-space: nowrap;
        }

        .sticky-model-bar select {
            flex: 1;
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #ffffff;
            color: var(--ink-1);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        .sticky-model-bar select:focus {
            border-color: #94a3b8;
        }

        .model-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
        }

        .model-badge.gpt { background: #10a37f; }
        .model-badge.claude { background: #d97757; }
        .model-badge.gemini { background: #60a5fa; color: #ffffff; }
        .model-badge.grok { background: #1a1a2e; }

        .history {
            padding: 18px;
            display: grid;
            gap: 14px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h2 {
            margin: 0;
            font-size: 18px;
        }

        .close-btn {
            border: 1px solid var(--border);
            background: #ffffff;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .list {
            display: grid;
            gap: 12px;
        }

        .item {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: grid;
            gap: 8px;
        }

        .thumbnail {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .item h4 {
            margin: 0;
            font-size: 13px;
            color: var(--ink-1);
        }

        .meta {
            font-size: 12px;
            color: var(--ink-2);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .summary {
            font-size: 12px;
            color: var(--ink-2);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 6px 8px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
        }

        .thought-card {
            display: grid;
            gap: 6px;
            padding: 10px 12px;
            border: 1px solid #dbe5f3;
            border-radius: 10px;
            background: linear-gradient(180deg, #fff7ed 0%, #fffbeb 100%);
        }

        .thought-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #9a3412;
        }

        .thought-body {
            font-size: 13px;
            line-height: 1.45;
            color: #7c2d12;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .metrics-wrap {
            overflow-x: auto;
        }

        .metrics-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            border: 1px solid #dbe5f3;
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
        }

        .metrics-table th,
        .metrics-table td {
            border-bottom: 1px solid #e8edf6;
            padding: 6px 8px;
            text-align: left;
            white-space: nowrap;
        }

        .metrics-table thead th {
            background: #f1f5f9;
            color: #334155;
            font-weight: 700;
        }

        .metrics-table tbody tr:last-child td {
            border-bottom: none;
        }

        .metrics-table .totals-row td {
            background: #f8fafc;
            font-weight: 700;
            color: #0f172a;
        }

        pre {
            margin: 0;
            background: #0b1220;
            color: #e2e8f0;
            padding: 10px;
            border-radius: 10px;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 260px;
            overflow: auto;
        }

        .empty {
            font-size: 13px;
            color: var(--ink-2);
            padding: 12px;
            border-radius: 10px;
            border: 1px dashed var(--border);
            background: #ffffff;
        }
    </style>
</head>
<body>
    <div class="sticky-model-bar">
        <label for="modelSelect">Reasoner Model</label>
        <select id="modelSelect"></select>
        <span class="model-badge" id="modelBadge"></span>
    </div>
    <div class="history">
        <div class="header">
            <h2>Question history</h2>
            <button class="close-btn" id="closeBtn" type="button">Close</button>
        </div>
        <div class="list" id="historyList">
            <div class="empty">No history yet.</div>
        </div>
    </div>
    <script src="history-window.js"></script>
</body>
</html>
