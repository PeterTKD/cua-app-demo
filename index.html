<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Assist Widget</title>
    <style>
        :root {
            --ink-1: #0f172a;
            --ink-2: rgba(255, 255, 255, 0.6);
            --panel: rgba(56, 60, 66, 0.9);
            --panel-soft: rgba(255, 255, 255, 0.08);
            --accent: #7dd3fc;
            --accent-2: #34d399;
            --shadow: 0 18px 35px rgba(17, 24, 39, 0.35);
            --bubble-user: rgba(255, 255, 255, 0.18);
            --bubble-assistant: rgba(22, 27, 34, 0.55);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: #f9fafb;
            overflow: hidden;
            height: 100%;
        }

        body {
            padding: 24px;
            height: 100%;
        }

        .assistant-widget {
            position: relative;
            width: min(420px, 92vw);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px 16px 12px;
            border-radius: 18px;
            background: var(--panel);
            color: #f9fafb;
            box-shadow: var(--shadow);
            -webkit-app-region: drag;
            overflow: hidden;
            min-height: 100px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        min-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        padding 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        border-radius 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.35s ease;
        }

        .assistant-widget.guide-process-active {
            width: min(420px, 92vw);
        }

        .assistant-widget.guide-process-active .chat-log,
        .assistant-widget.guide-process-active .widget-input {
            display: none;
        }

        .assistant-widget.guide-process-active .mode-chip {
            display: inline-flex !important;
        }

        .open-chat-btn {
            display: none !important;
        }

        .assistant-widget.guide-process-active .open-chat-btn {
            display: grid !important;
        }

        .widget-header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 18px;
        }

        .mode-chip {
            display: none;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.24);
            color: #dbeafe;
            background: rgba(59, 130, 246, 0.25);
        }

        .live-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #f59e0b;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
            animation: live-glow 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes live-glow {
            0%, 100% {
                box-shadow: 0 0 4px rgba(245, 158, 11, 0.3);
                background: #f59e0b;
            }
            50% {
                box-shadow: 0 0 14px rgba(245, 158, 11, 0.9);
                background: #fbbf24;
            }
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--ink-2);
        }

        .widget-content {
            display: contents;
        }

        .status-line {
            font-size: 12px;
            color: var(--ink-2);
            letter-spacing: 0.3px;
        }

        .chat-log {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 2px 4px;
            max-height: 380px;
            overflow-y: auto;
            -webkit-app-region: no-drag;
            scrollbar-width: none;
            -ms-overflow-style: none;
            opacity: 1;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.25s ease,
                        padding 0.25s ease;
        }

        .chat-log.has-messages {
            padding: 10px 4px 6px;
            min-height: 48px;
        }

        .chat-log::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.35;
            backdrop-filter: blur(6px);
        }

        .chat-bubble p {
            margin: 0 0 6px;
        }

        .chat-bubble p:last-child {
            margin-bottom: 0;
        }

        .chat-bubble ul {
            margin: 4px 0 6px 18px;
            padding: 0;
        }

        .chat-bubble li {
            margin: 2px 0;
        }

        .chat-bubble code {
            font-family: "Consolas", "Courier New", monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 4px;
            border-radius: 6px;
        }

        .chat-bubble pre {
            margin: 6px 0;
            padding: 8px 10px;
            background: rgba(15, 23, 42, 0.45);
            border-radius: 10px;
            overflow-x: auto;
        }

        .chat-bubble pre code {
            background: transparent;
            padding: 0;
        }

        .chat-bubble a {
            color: #93c5fd;
            text-decoration: none;
        }

        .chat-bubble a:hover {
            text-decoration: underline;
        }

        .chat-bubble.assistant {
            align-self: flex-start;
            background: var(--bubble-assistant);
            color: #e5e7eb;
        }

        .chat-bubble.user {
            align-self: flex-end;
            background: var(--bubble-user);
            color: #f9fafb;
        }

        .chat-bubble.system {
            align-self: center;
            background: rgba(245, 158, 11, 0.14);
            border: 1px solid rgba(245, 158, 11, 0.7);
            color: #fcd34d;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 11px;
        }

        .chat-bubble.task-completed {
            background: rgba(22, 163, 74, 0.12);
            border: 1px solid rgba(22, 163, 74, 0.6);
            color: #86efac;
        }

        .widget-input {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel-soft);
            border-radius: 999px;
            padding: 6px 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            -webkit-app-region: no-drag;
            opacity: 1;
            transition: opacity 0.25s ease,
                        max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        padding 0.25s ease;
        }

        .widget-input input {
            background: transparent;
            border: none;
            outline: none;
            color: #f9fafb;
            font-size: 15px;
            width: 100%;
            min-width: 120px;
            -webkit-app-region: no-drag;
        }

        .widget-input input::placeholder {
            color: rgba(249, 250, 251, 0.6);
        }

        .widget-input button {
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: #0f172a;
            padding: 8px 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            -webkit-app-region: no-drag;
        }

        .widget-input button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(125, 211, 252, 0.3);
        }

        .widget-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            -webkit-app-region: no-drag;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.08);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
            color: #f9fafb;
            -webkit-app-region: no-drag;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-1px);
        }

        .icon-btn.close-btn {
            color: #fca5a5;
            border-color: rgba(248, 113, 113, 0.4);
        }

        .icon-btn.hidden {
            display: none;
        }

        .icon-btn.tts-active {
            background: rgba(125, 211, 252, 0.25);
            border-color: rgba(125, 211, 252, 0.5);
            color: var(--accent);
        }

        .icon-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #videoElement {
            position: fixed;
            inset: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* Assistant bubble entrance — slides up */
        @keyframes bubble-in {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .chat-bubble.assistant,
        .chat-bubble.system {
            animation: bubble-in 0.3s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        /* User bubble entrance — pops from the right */
        @keyframes user-send {
            0% {
                opacity: 0;
                transform: translateX(20px) scale(0.9);
            }
            50% {
                transform: translateX(-3px) scale(1.02);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .chat-bubble.user {
            animation: user-send 0.35s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        /* Streaming cursor for typewriter effect */
        .chat-bubble.streaming::after {
            content: '';
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: cursor-blink 0.6s ease-in-out infinite;
        }

        @keyframes cursor-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Focus mode transition pulse */
        @keyframes focus-pulse {
            0% { box-shadow: var(--shadow), 0 0 0 0 rgba(245, 158, 11, 0.5); }
            50% { box-shadow: var(--shadow), 0 0 0 6px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 10px 20px rgba(17, 24, 39, 0.25); }
        }

        .assistant-widget.focus-entering {
            animation: focus-pulse 0.5s ease-out forwards;
        }

        @keyframes chat-expand {
            0% { box-shadow: 0 10px 20px rgba(17, 24, 39, 0.25), 0 0 0 0 rgba(125, 211, 252, 0.4); }
            50% { box-shadow: var(--shadow), 0 0 0 5px rgba(125, 211, 252, 0); }
            100% { box-shadow: var(--shadow); }
        }

        .assistant-widget.chat-entering {
            animation: chat-expand 0.45s ease-out forwards;
        }

        @media (max-width: 760px) {
            .assistant-widget {
                grid-template-columns: 1fr;
                gap: 8px;
                border-radius: 20px;
                padding: 12px;
                width: min(92vw, 420px);
            }
        }
    </style>
</head>
<body>
    <div class="assistant-widget" id="assistantWidget">
        <div class="widget-header">
            <div>
                <div class="header-title">
                    <span class="live-dot" aria-hidden="true"></span>
                    Guidy
                    <span class="mode-chip" id="modeBadge">Focus</span>
                </div>
                <div class="header-subtitle" id="statusText">Watching: Screen share</div>
            </div>
            <div class="widget-actions">
                <button class="icon-btn" id="selectScreenBtn" title="Choose screen">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="12" rx="2"></rect>
                        <path d="M8 20h8"></path>
                        <path d="M12 16v4"></path>
                    </svg>
                </button>
                <!-- <button class="icon-btn" id="diffMethodBtn" title="Different method" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 6v6l4 2"></path>
                        <path d="M21 12a9 9 0 1 1-3.5-7"></path>
                        <path d="M21 3v5h-5"></path>
                    </svg>
                </button>
                <button class="icon-btn" id="pointElementBtn" title="Point at element" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3v4"></path>
                        <path d="M12 17v4"></path>
                        <path d="M3 12h4"></path>
                        <path d="M17 12h4"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button> -->
                <button class="icon-btn" id="historyBtn" title="History" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 5v14"></path>
                        <path d="M5 12h14"></path>
                    </svg>
                </button>
                <button class="icon-btn open-chat-btn" id="openChatBtn" title="Open chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
                    </svg>
                </button>
                <!-- <button class="icon-btn" id="nextBtn" title="Next step" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"></path>
                        <path d="M13 5l7 7-7 7"></path>
                    </svg>
                </button> -->

                <button class="icon-btn" id="ttsToggleBtn" title="Enable audio">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                </button>

                <button class="icon-btn close-btn" id="closeBtn" title="Close">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 6L6 18"></path>
                        <path d="M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
        <div class="chat-log" id="chatLog"></div>
        <div class="widget-input">
            <input id="questionInput" type="text" placeholder="Ask anything about this screen" />
            <button id="askBtn" type="button">Send</button>
        </div>
    </div>

    <video id="videoElement" autoplay muted></video>

    <script type="module" src="renderer/app.js"></script>
</body>
</html>
